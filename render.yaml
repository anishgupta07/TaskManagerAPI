databases:
  - name: taskmanager-db
    databaseName: taskmanager
    user: taskmanager
    plan: free

services:
  - type: web
    name: taskmanager-api
    env: docker
    plan: free
    healthCheckPath: /tasks
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: taskmanager-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: taskmanager-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
