databases:
  - name: taskmanager-db
    databaseName: taskmanager
    user: taskmanager
    plan: free

services:
  - type: web
    name: taskmanager-api
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
